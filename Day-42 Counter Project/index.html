<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="counter">
            <header>Counter</header>
            <h1>0</h1>
            <div class="btn">
                <button class="btnn inc"><h2>+</h2></button>
                <button class="reset"><h2>Reset</h2></button>
                <button class="btnn dec"><h2>-</h2></button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
