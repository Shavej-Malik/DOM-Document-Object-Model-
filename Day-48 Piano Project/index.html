<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>   
        <div class="piano-box">       
            <div class="white-key key" id="one">C</div>
            <div class="white-key key" id="two">D</div>
            <div class="white-key key" id="three">E</div>
            <div class="white-key key" id="four">F</div>
            <div class="white-key key" id="five">G</div>
            <div class="white-key key" id="six">A</div>
            <div class="white-key key" id="seven">B</div>
            <div class="white-key key" id="eight">C</div>
            <div class="white-key key" id="nine">D</div>
            <div class="white-key key" id="ten">E</div>
            <div class="white-key key" id="eleven">F</div>
            <div class="white-key key" id="twelve">G</div>
            <div class="white-key key" id="thirteen">A</div>
            <div class="white-key key" id="fourteen">B</div>
            <div class="white-key key" id="fifteen">C</div>
            <div class="white-key key" id="sixteen">D</div>
            <div class="white-key key" id="seventeen">E</div>
            <div class="white-key key" id="eighteen">F</div>
            <div class="white-key key" id="ninteen">G</div>
            <div class="white-key key" id="twenty">A</div>
            <div class="white-key key" id="twenty-one">B</div>
            
            <div class="black-key key black-1">0</div>
            <div class="black-key key black-2">1</div>
            <div class="black-key key black-4">2</div>
            <div class="black-key key black-5">3</div>
            <div class="black-key key black-6">4</div>
            <div class="black-key key black-8">5</div>
            <div class="black-key key black-9">6</div>
            <div class="black-key key black-11">7</div>
            <div class="black-key key black-12">8</div>
            <div class="black-key key black-13">9</div>
            <div class="black-key key black-15">v</div>
            <div class="black-key key black-16">w</div>
            <div class="black-key key black-18">x</div>
            <div class="black-key key black-19">y</div>
            <div class="black-key key black-20">z</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
